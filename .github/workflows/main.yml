name: Build Mod

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write   # dibutuhkan untuk membuat Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      # Gradle disediakan langsung oleh Actions, jadi gradlew tidak wajib ada di repo.
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: current

      - name: Build
        run: |
          if [ -f gradlew ]; then
            chmod +x gradlew
            ./gradlew build --no-daemon
          else
            gradle build --no-daemon
          fi

      - name: Upload JAR (tab Actions > Artifacts)
        uses: actions/upload-artifact@v4
        with:
          name: riptide-cooldown-jar
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar

      - name: Buat Release (hanya kalau push tag, mis. v1.0.0)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          generate_release_notes: true
